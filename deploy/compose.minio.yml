# Local object store for celld fleet experiments (NOT production-qualified).
# Usage:
#   export CELLD_BUCKET=s3://sinkd-cells
#   export AWS_ACCESS_KEY_ID=sinkd
#   export AWS_SECRET_ACCESS_KEY=sinkdsecret
#   export AWS_REGION=us-east-1
#   export S3_ENDPOINT=http://minio:9000
#   ./scripts/compose.sh -f docker-compose.yml -f compose.minio.yml up -d

services:
  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-sinkd}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sinkdsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - sinkd

  minio-init:
    image: docker.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          [ "$$i" -gt 30 ] && exit 1
          sleep 1
        done
        mc mb --ignore-existing local/sinkd-cells
        mc ls local
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-sinkd}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sinkdsecret}
    networks:
      - sinkd

  celld-a:
    environment:
      CELLD_BUCKET: ${CELLD_BUCKET:-s3://sinkd-cells}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-sinkd}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-sinkdsecret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      - minio-init

  celld-b:
    environment:
      CELLD_BUCKET: ${CELLD_BUCKET:-s3://sinkd-cells}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-sinkd}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-sinkdsecret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      - minio-init

volumes:
  minio-data: