name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @synkd/studio run build
      - run: pnpm --filter @synkd/console run build
      - run: pnpm --filter @synkd/site build
        env:
          SYNKD_SITE_BASE: /synkd/
      - name: Node runtime WS smoke
        run: |
          pnpm --filter @synkd/cli exec tsx src/bin.ts dev --root ../../apps/parties --port 8787 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/healthz && break
            sleep 0.5
          done
          pnpm --filter @synkd/runtime exec node ./scripts/ws-smoke.mjs http://127.0.0.1:8787
          curl -sf http://127.0.0.1:8787/metrics | grep -q synkd_info
      - name: Install Playwright Chromium
        run: |
          pnpm --filter @synkd/studio exec playwright install --with-deps chromium
          pnpm --filter @synkd/console exec playwright install chromium
      - name: Studio e2e (chat + pad)
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Console e2e
        run: pnpm test:e2e:console
        env:
          CI: "true"

  celld-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install podman
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman
          podman info
      - name: celld smoke (HTTP + WS)
        run: pnpm celld:smoke
