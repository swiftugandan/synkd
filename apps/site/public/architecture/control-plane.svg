<svg xmlns="http://www.w3.org/2000/svg" width="410.4pt" height="110pt"
     viewBox="0 0 410.4 110" role="img"
     aria-label="Guest traffic uses party paths. Operator traffic uses the Console
                 and admin /v1 API into the same runtime inspector.">
  <defs>
    <marker id="ctl-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink, #d7f0ea)"/>
    </marker>
  </defs>

  <rect x="0.5" y="8.5" width="100" height="40" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="50.5" y="26" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Studio / apps</text>
  <text x="50.5" y="40" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">guest token</text>

  <rect x="0.5" y="62.5" width="100" height="40" rx="2"
        fill="var(--pale, #123447)" stroke="var(--ink, #d7f0ea)" stroke-width="2"/>
  <text x="50.5" y="80" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Console</text>
  <text x="50.5" y="94" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">admin token</text>

  <line x1="102" y1="28.5" x2="148" y2="28.5"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctl-arrow)"/>
  <line x1="102" y1="82.5" x2="148" y2="82.5"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctl-arrow)"/>

  <rect x="150.5" y="8.5" width="110" height="40" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="205.5" y="26" text-anchor="middle" font-size="8"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">/parties/...</text>
  <text x="205.5" y="40" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">rooms</text>

  <rect x="150.5" y="62.5" width="110" height="40" rx="2"
        fill="var(--pale, #123447)" stroke="var(--ink, #d7f0ea)" stroke-width="2"/>
  <text x="205.5" y="80" text-anchor="middle" font-size="8"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">/v1/*</text>
  <text x="205.5" y="94" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">control API</text>

  <line x1="262" y1="28.5" x2="290" y2="45"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctl-arrow)"/>
  <line x1="262" y1="82.5" x2="290" y2="65"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctl-arrow)"/>

  <rect x="292.5" y="28.5" width="117" height="54" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="351" y="48" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Runtime</text>
  <text x="351" y="62" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">inspector + rooms</text>
  <text x="351" y="74" text-anchor="middle" font-size="7"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">one process</text>
</svg>
