<svg xmlns="http://www.w3.org/2000/svg" width="410.4pt" height="168pt"
     viewBox="0 0 410.4 168" role="img"
     aria-label="Browsers and operators reach an optional TLS ingress, then either
                 the Node runtime or a celld fleet. Both hosts run the same party
                 class code. Durable storage sits under each host.">
  <defs>
    <marker id="ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink, #d7f0ea)"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="120" height="40" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="60.5" y="18" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Browsers</text>
  <text x="60.5" y="32" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">Studio / apps</text>

  <rect x="145.5" y="0.5" width="120" height="40" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="205.5" y="18" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Operators</text>
  <text x="205.5" y="32" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">Console / CLI</text>

  <line x1="60.5" y1="42" x2="60.5" y2="58"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctx-arrow)"/>
  <line x1="205.5" y1="42" x2="205.5" y2="58"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctx-arrow)"/>
  <line x1="60.5" y1="58" x2="205.5" y2="58"
        stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <line x1="133" y1="58" x2="133" y2="68"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctx-arrow)"/>

  <rect x="58.5" y="70.5" width="149" height="28" rx="2"
        fill="var(--pale, #123447)" stroke="var(--ink, #d7f0ea)" stroke-width="2"/>
  <text x="133" y="88" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">TLS ingress (optional Caddy)</text>

  <line x1="100" y1="100" x2="100" y2="112"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctx-arrow)"/>
  <line x1="166" y1="100" x2="166" y2="112"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#ctx-arrow)"/>
  <text x="88" y="110" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">or</text>

  <rect x="20.5" y="114.5" width="130" height="34" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="85.5" y="130" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Node runtime</text>
  <text x="85.5" y="142" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">@synkd/runtime</text>

  <rect x="160.5" y="114.5" width="130" height="34" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="225.5" y="130" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">celld fleet</text>
  <text x="225.5" y="142" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">Durable Objects</text>

  <rect x="300.5" y="114.5" width="109" height="34" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"
        stroke-dasharray="5 3"/>
  <text x="355" y="130" text-anchor="middle" font-size="8"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Same party code</text>
  <text x="355" y="142" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">@synkd/server</text>

  <text x="205.5" y="162" text-anchor="middle" font-size="7"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Dashed box = shared application layer, not a separate process</text>
</svg>
