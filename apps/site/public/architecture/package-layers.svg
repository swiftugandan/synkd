<svg xmlns="http://www.w3.org/2000/svg" width="410.4pt" height="156pt"
     viewBox="0 0 410.4 156" role="img"
     aria-label="Five package layers from apps at the top down through hosts,
                 party API, foundation, and storage outside the process boundary.">
  <rect x="1" y="1" width="408.4" height="28" fill="var(--pale, #123447)"
        stroke="var(--ink, #d7f0ea)" stroke-width="2"/>
  <text x="10" y="14" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Apps</text>
  <text x="10" y="25" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">studio - console - site - parties</text>
  <text x="400" y="19" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">what people open</text>

  <rect x="0.5" y="32.5" width="409" height="28" fill="var(--paper, #0a1f2c)"
        stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="10" y="45" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Hosts</text>
  <text x="10" y="56" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">runtime - adapter-celld - cli - control</text>
  <text x="400" y="50" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">process / fleet</text>

  <rect x="0.5" y="63.5" width="409" height="28" fill="var(--paper, #0a1f2c)"
        stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="10" y="76" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Party API</text>
  <text x="10" y="87" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">server - y - client - auth</text>
  <text x="400" y="81" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">portable code</text>

  <rect x="0.5" y="94.5" width="409" height="28" fill="var(--paper, #0a1f2c)"
        stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="10" y="107" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Foundation</text>
  <text x="10" y="118" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">contracts - config - ui</text>
  <text x="400" y="112" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">shared truth</text>

  <rect x="0.5" y="125.5" width="409" height="28" fill="var(--paper, #0a1f2c)"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="10" y="138" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Durable storage</text>
  <text x="10" y="149" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">SQLite files - DO storage - object store</text>
  <text x="400" y="143" text-anchor="end" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">outside boundary</text>
</svg>
