<svg xmlns="http://www.w3.org/2000/svg" width="410.4pt" height="150pt"
     viewBox="0 0 410.4 150" role="img"
     aria-label="Browser reaches Caddy on 443. Caddy sticky-balances to celld-a
                 or celld-b. Both nodes share an object store for Durable Object state.">
  <defs>
    <marker id="flt-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink, #d7f0ea)"/>
    </marker>
  </defs>

  <rect x="150.5" y="0.5" width="110" height="32" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="205.5" y="14" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Browser</text>
  <text x="205.5" y="26" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">wss</text>

  <line x1="205.5" y1="34" x2="205.5" y2="48"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#flt-arrow)"/>

  <rect x="120.5" y="50.5" width="170" height="32" rx="2"
        fill="var(--pale, #123447)" stroke="var(--ink, #d7f0ea)" stroke-width="2"/>
  <text x="205.5" y="64" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Caddy :443</text>
  <text x="205.5" y="76" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">TLS - sticky cookie synkd_lb</text>

  <line x1="160" y1="84" x2="100" y2="98"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#flt-arrow)"/>
  <line x1="250" y1="84" x2="310" y2="98"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" marker-end="url(#flt-arrow)"/>

  <rect x="20.5" y="100.5" width="140" height="32" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="90.5" y="114" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">celld-a :8080</text>
  <text x="90.5" y="126" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">DO rooms</text>

  <rect x="250.5" y="100.5" width="140" height="32" rx="2"
        fill="var(--paper, #0a1f2c)" stroke="var(--ink, #d7f0ea)" stroke-width="1"/>
  <text x="320.5" y="114" text-anchor="middle" font-size="8.5"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">celld-b :8080</text>
  <text x="320.5" y="126" text-anchor="middle" font-size="7"
        font-family="var(--mono, 'Courier New', monospace)"
        fill="var(--ink, #d7f0ea)">DO rooms</text>

  <path d="M 90.5 134 L 90.5 140 L 320.5 140 L 320.5 134" fill="none"
        stroke="var(--ink, #d7f0ea)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205.5" y="148" text-anchor="middle" font-size="7"
        font-family="var(--sans, 'Avenir Next', Arial, sans-serif)"
        fill="var(--ink, #d7f0ea)">Object store (R2 / S3 / GCS / Azure) - dashed = shared durability</text>
</svg>
